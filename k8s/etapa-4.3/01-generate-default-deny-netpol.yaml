apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-deny-netpol
  annotations:
    policies.kyverno.io/title: Generate Default Deny NetworkPolicy
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace,NetworkPolicy
    policies.kyverno.io/description: >-
      Gera automaticamente uma NetworkPolicy default-deny para
      todo novo namespace criado no cluster.
spec:
  background: true

  rules:
    - name: generate-default-deny
      match:
        any:
          - resources:
              kinds:
                - Namespace

      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno

      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        generateExisting: false

        data:
          metadata:
            labels:
              app: default-deny
              team: platform
              env: cluster
              created-by: kyverno

          spec:
            podSelector: {}

            policyTypes:
              - Ingress
              - Egress