apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operador-contas
  namespace: tipsbank-contas
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operador-contas
  namespace: tipsbank-contas
subjects:
  - kind: User
    name: operador-contas
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: operador-contas
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operador-transacoes
  namespace: tipsbank-transacoes
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operador-transacoes
  namespace: tipsbank-transacoes
subjects:
  - kind: User
    name: operador-transacoes
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: operador-transacoes
  apiGroup: rbac.authorization.k8s.io