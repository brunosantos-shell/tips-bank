apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-api-contas
  namespace: tipsbank-contas
  labels:
    app: api-contas
    team: tipsbank
    env: lab
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-contas-pod-reader
  namespace: tipsbank-contas
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-contas-pod-reader
  namespace: tipsbank-contas
subjects:
  - kind: ServiceAccount
    name: sa-api-contas
    namespace: tipsbank-contas
roleRef:
  kind: Role
  name: api-contas-pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-api-transacoes
  namespace: tipsbank-transacoes
  labels:
    app: api-transacoes
    team: tipsbank
    env: lab
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-transacoes-pod-reader
  namespace: tipsbank-transacoes
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-transacoes-pod-reader
  namespace: tipsbank-transacoes
subjects:
  - kind: ServiceAccount
    name: sa-api-transacoes
    namespace: tipsbank-transacoes
roleRef:
  kind: Role
  name: api-transacoes-pod-reader
  apiGroup: rbac.authorization.k8s.io