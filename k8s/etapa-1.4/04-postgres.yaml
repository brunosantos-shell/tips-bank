apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: tipsbank-contas
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS contas (
        id VARCHAR(64) PRIMARY KEY,
        titular VARCHAR(120) NOT NULL,
        documento VARCHAR(14) NOT NULL UNIQUE,
        senha_hash VARCHAR(255) NOT NULL DEFAULT '',
        saldo NUMERIC(15, 2) NOT NULL DEFAULT 0,
        criada_em TIMESTAMP DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_contas_documento ON contas(documento);

    CREATE TABLE IF NOT EXISTS transacoes (
        id VARCHAR(64) PRIMARY KEY,
        origem_id VARCHAR(64) NOT NULL,
        destino_id VARCHAR(64) NOT NULL,
        valor NUMERIC(15, 2) NOT NULL,
        status VARCHAR(20) NOT NULL,
        criada_em TIMESTAMP DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_transacoes_origem ON transacoes(origem_id);
    CREATE INDEX IF NOT EXISTS idx_transacoes_destino ON transacoes(destino_id);

    INSERT INTO contas (id, titular, documento, senha_hash, saldo) VALUES
        ('11111111-1111-1111-1111-111111111111', 'Jeferson Fernando', '12345678901',
         '$2b$10$5SvZ8xkTk5HEldopD9Vig.UAu2icE2IxskWxaPtl1PjQ0o3xNfDme', 10000.00),
        ('22222222-2222-2222-2222-222222222222', 'LinuxTips SA', '98765432100',
         '$2b$10$5SvZ8xkTk5HEldopD9Vig.UAu2icE2IxskWxaPtl1PjQ0o3xNfDme', 500.00)
    ON CONFLICT (documento) DO NOTHING;

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: tipsbank-contas
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tipsbank-contas
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: secret-db
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tipsbank-contas
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
