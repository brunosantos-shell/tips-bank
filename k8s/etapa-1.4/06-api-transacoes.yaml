apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-transacoes
  template:
    metadata:
      labels:
        app: api-transacoes
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: api-transacoes
          image: ghcr.io/brunosantostecinf-shell/tipsbank-api-transacoes:v1.0.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: configmap-app
            - secretRef:
                name: secret-db
---
apiVersion: v1
kind: Service
metadata:
  name: api-transacoes
  namespace: tipsbank-transacoes
spec:
  type: ClusterIP
  selector:
    app: api-transacoes
  ports:
    - port: 8080
      targetPort: 8080
