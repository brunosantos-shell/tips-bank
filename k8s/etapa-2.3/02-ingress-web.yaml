apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-web
  namespace: tipsbank-web
  annotations:
    cert-manager.io/cluster-issuer: tipsbank-letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.bits.tec.br
      secretName: app-bits-tec-br-tls
  rules:
    - host: app.bits.tec.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080

