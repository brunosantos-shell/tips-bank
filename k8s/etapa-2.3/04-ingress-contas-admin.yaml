apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-contas-admin
  namespace: tipsbank-contas
  annotations:
    cert-manager.io/cluster-issuer: tipsbank-letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "TipsBank Admin"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.bits.tec.br
      secretName: api-contas-admin-bits-tec-br-tls

  rules:
    - host: api.bits.tec.br
      http:
        paths:
          - path: /contas/admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-contas
                port:
                  number: 8080
