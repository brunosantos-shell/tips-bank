apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-transacoes
  namespace: tipsbank-transacoes
  annotations:
    cert-manager.io/cluster-issuer: tipsbank-letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: tipsbank-transacoes
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.bits.tec.br
      secretName: api-transacoes-bits-tec-br-tls

  rules:
    - host: api.bits.tec.br
      http:
        paths:
          - path: /transacoes(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-transacoes
                port:
                  number: 8080
