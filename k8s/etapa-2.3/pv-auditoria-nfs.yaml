apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-tipsbank-auditoria-nfs

spec:
  capacity:
    storage: 5Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: nfs-auditoria

  mountOptions:
    - hard
    - nfsvers=4.1

  nfs:
    server: fs-047dd814ba41937d0.efs.us-east-1.amazonaws.com
    path: /
