apiVersion: v1
kind: Pod
metadata:
  name: debug-nfs-auditoria
  namespace: tipsbank-auditoria
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: auditoria-data
          mountPath: /data
  volumes:
    - name: auditoria-data
      persistentVolumeClaim:
        claimName: pvc-tipsbank-auditoria-nfs
