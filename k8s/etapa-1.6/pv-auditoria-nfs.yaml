apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-tipsbank-auditoria-nfs
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-auditoria
  mountOptions:
    - hard
    - nfsvers=4.1
    - proto=tcp
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.20.100
    path: /srv/nfs/tipsbank-auditoria
