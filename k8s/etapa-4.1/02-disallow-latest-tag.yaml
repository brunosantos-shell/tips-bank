apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Bloqueia imagens de containers que utilizam a tag latest.
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: validate-container-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          A tag latest não é permitida. Informe uma versão explícita da imagem.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ ends_with(element.image, ':latest') }}"
                    operator: Equals
                    value: true

    - name: validate-init-container-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          A tag latest não é permitida em initContainers.
        foreach:
          - list: request.object.spec.initContainers || `[]`
            deny:
              conditions:
                all:
                  - key: "{{ ends_with(element.image, ':latest') }}"
                    operator: Equals
                    value: true

    - name: validate-ephemeral-container-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          A tag latest não é permitida em ephemeralContainers.
        foreach:
          - list: request.object.spec.ephemeralContainers || `[]`
            deny:
              conditions:
                all:
                  - key: "{{ ends_with(element.image, ':latest') }}"
                    operator: Equals
                    value: true