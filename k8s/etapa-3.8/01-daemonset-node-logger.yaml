apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  namespace: tipsbank-monitoring
  labels:
    app: node-logger
spec:
  selector:
    matchLabels:
      app: node-logger

  template:
    metadata:
      labels:
        app: node-logger

    spec:
      tolerations:
        - key: "compliance"
          operator: "Equal"
          value: "strict"
          effect: "NoSchedule"

      nodeSelector:
        kubernetes.io/os: linux

      containers:
        - name: node-logger
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "===== node-logger ====="
                echo "Data: $(date)"
                echo "Pod: $HOSTNAME"
                echo "Node: $NODE_NAME"
                echo "--- Disco ---"
                df -h
                echo "--- Memoria ---"
                free -m || true
                echo "======================="
                sleep 30
              done

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi