apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-transacoes-v2
  namespace: tipsbank-transacoes
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-transacoes
      version: v2

  template:
    metadata:
      labels:
        app: api-transacoes
        version: v2

    spec:
      securityContext:
        fsGroup: 65532

      imagePullSecrets:
        - name: registry-secret

      initContainers:
        - name: init-log-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/app
              touch /var/log/app/app.log
              chmod -R 777 /var/log/app
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app

      containers:
        - name: api-transacoes
          image: ghcr.io/brunosantostecinf-shell/tipsbank-api-transacoes:v2.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3

          env:
            - name: APP_VERSION
              value: "v2"

            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: transacoes-secret
                  key: DB_URL

            - name: CONTAS_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-config
                  key: CONTAS_URL

            - name: AUDITORIA_URL
              valueFrom:
                configMapKeyRef:
                  name: transacoes-config
                  key: AUDITORIA_URL

          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app

        - name: log-forwarder
          image: busybox:1.36
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/app
              chmod -R 777 /var/log/app
              touch /var/log/app/app.log
              tail -F /var/log/app/app.log

          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app

      volumes:
        - name: app-logs
          emptyDir: {}
