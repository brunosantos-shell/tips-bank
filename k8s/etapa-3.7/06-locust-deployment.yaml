apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: tipsbank-monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: locust

  template:
    metadata:
      labels:
        app: locust

    spec:
      containers:
      - name: locust

        image: locustio/locust:2.37.10

        ports:
        - containerPort: 8089
          name: web

        volumeMounts:
        - name: locust-script
          mountPath: /mnt/locust

        args:
        - -f
        - /mnt/locust/locustfile.py
        - --host
        - http://web.tipsbank-web:8080

        env:
        - name: LOCUST_HOST
          value: http://web.tipsbank-web:8080

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

      volumes:
      - name: locust-script
        configMap:
          name: locustfile

---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: tipsbank-monitoring
spec:
  selector:
    app: locust

  ports:
    - name: web
      port: 8089
      targetPort: 8089

  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: locust
  namespace: tipsbank-monitoring
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    nginx.ingress.kubernetes.io/backend-protocol: HTTP

spec:
  ingressClassName: nginx

  tls:
  - hosts:
      - locust.tipsbank.local
    secretName: locust-tls

  rules:
  - host: locust.tipsbank.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: locust
            port:
              number: 8089